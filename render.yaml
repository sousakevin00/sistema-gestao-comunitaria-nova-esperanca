databases:
  - name: nova-esperanca-db
    plan: free
    databaseName: nova_esperanca
    user: nova_esperanca

services:
  - type: web
    name: nova-esperanca-django
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python -m gunicorn config.wsgi:application
    healthCheckPath: /healthz/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nova-esperanca-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
