<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gestão Comunitária{% endblock %} | Nova Esperança</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #20323b; background: #f5f8f7; }
    body { margin: 0; min-height: 100vh; }
    header { background: #14594d; color: white; padding: 1rem max(1rem, calc((100vw - 1024px)/2)); }
    header strong { font-size: 1.15rem; }
    nav { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: .8rem; }
    nav a { color: white; }
    .accessibility { margin-left: auto; background: white; color: #14594d; border: 2px solid white; }
    .accessibility:hover { background: #e7f3ef; color: #0d4037; }
    :focus-visible { outline: 3px solid #d78200; outline-offset: 3px; }
    .high-contrast { color: #fff; background: #111; }
    .high-contrast header, .high-contrast .button, .high-contrast form button { background: #000; color: #fff; }
    .high-contrast .card, .high-contrast form, .high-contrast .table-wrap { background: #111; color: #fff; border: 2px solid #ffdf00; }
    .high-contrast .card b, .high-contrast footer { color: #ffdf00; }
    .high-contrast a { color: #ffdf00; }
    .high-contrast .button, .high-contrast form button { border: 2px solid #ffdf00; }
    .high-contrast .accessibility { background: #ffdf00; color: #000; border-color: #ffdf00; }
    .high-contrast th, .high-contrast td { border-color: #ffdf00; }
    .high-contrast input, .high-contrast select, .high-contrast textarea { background: #000; color: #fff; border: 2px solid #ffdf00; }
    .high-contrast .message { background: #000; color: #ffdf00; border: 2px solid #ffdf00; }
    .high-contrast .errorlist { color: #ff9b9b; }
    .high-contrast :focus-visible { outline-color: #fff; }
    main { max-width: 1024px; margin: 2rem auto; padding: 0 1rem; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
    .card, form, .table-wrap { background: white; border: 1px solid #dbe6e2; border-radius: .6rem; padding: 1.25rem; }
    .card b { display: block; font-size: 2rem; color: #14594d; }
    .actions { display: flex; gap: .75rem; flex-wrap: wrap; margin: 1.5rem 0; }
    .button, button { display: inline-block; background: #14594d; color: white; border: 0; border-radius: .4rem; padding: .7rem 1rem; text-decoration: none; cursor: pointer; }
    .button:hover, button:hover { background: #0d4037; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .7rem; text-align: left; border-bottom: 1px solid #dbe6e2; }
    .table-wrap { overflow-x: auto; }
    label { display: block; font-weight: 600; margin: .9rem 0 .25rem; }
    input, select, textarea { box-sizing: border-box; width: 100%; max-width: 550px; padding: .6rem; border: 1px solid #92aaa2; border-radius: .3rem; font: inherit; }
    textarea { min-height: 5rem; }
    .errorlist { color: #a12626; }
    .message { padding: .8rem; background: #daf1e9; border-radius: .4rem; }
    footer { max-width: 1024px; margin: 3rem auto 1rem; padding: 0 1rem; color: #4b615b; }
  </style>
</head>
<body>
  <header><strong>Associação Nova Esperança</strong><nav aria-label="Navegação principal"><a href="{% url 'inicio' %}">Início</a><a href="{% url 'familias' %}">Famílias</a><a href="{% url 'doacoes' %}">Doações</a><a href="{% url 'entregas' %}">Entregas</a><button class="accessibility" type="button" id="contrast-toggle" aria-pressed="false">Ativar alto contraste</button></nav></header>
  <main>
    {% for message in messages %}<p class="message" role="status">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer>Projeto acadêmico demonstrativo. Use apenas dados fictícios.</footer>
  <script>
    const contrastToggle = document.getElementById('contrast-toggle');
    function setContrast(enabled) {
      document.body.classList.toggle('high-contrast', enabled);
      contrastToggle.setAttribute('aria-pressed', String(enabled));
      contrastToggle.textContent = enabled ? 'Desativar alto contraste' : 'Ativar alto contraste';
      localStorage.setItem('nova-esperanca-high-contrast', enabled ? '1' : '0');
    }
    setContrast(localStorage.getItem('nova-esperanca-high-contrast') === '1');
    contrastToggle.addEventListener('click', () => setContrast(contrastToggle.getAttribute('aria-pressed') !== 'true'));
  </script>
</body>
</html>
